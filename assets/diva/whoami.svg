    <text x="32" y="114" class="ln" style="animation-delay:1.0s"><tspan class="k">education:</tspan>    <tspan class="v">B.Sc. Computer Science, Alryada University</tspan><tspan class="c" x="620"># GPA 3.68 · 2027</tspan></text>
    <text x="32" y="140" class="ln" style="animation-delay:1.25s"><tspan class="k">experience:</tspan></text>
    <text x="32" y="166" class="ln" style="animation-delay:1.5s">  <tspan class="m">-</tspan> <tspan class="v">Observability Intern @ EJADA</tspan><tspan class="c" x="620"># tracing, alerting, RCA</tspan></text>
    <text x="32" y="192" class="ln" style="animation-delay:1.75s">  <tspan class="m">-</tspan> <tspan class="v">Fortinet Security Engineer track @ DEPI/NTI</tspan><tspan class="c" x="620"># FortiGate, VPN, IPS</tspan></text>
    <text x="32" y="218" class="ln" style="animation-delay:2.0s"><tspan class="k">highlight:</tspan>    <tspan class="v">1st place · DevOpsDays Cairo 2026 Hackathon</tspan></text>
    <text x="32" y="244" class="ln" style="animation-delay:2.25s"><tspan class="k">focus:</tspan>        <tspan class="v">devops</tspan> <tspan class="k">→</tspan> <tspan class="v">devsecops</tspan><tspan class="c" x="620"># shifting security left</tspan></text>
    <text x="32" y="278" class="ln" style="animation-delay:2.6s"><tspan class="m">$</tspan> <tspan class="k blink">▍</tspan></text>
