<svg xmlns="http://www.w3.org/2000/svg" width="960" height="304" viewBox="0 0 960 304" fill="none" role="img" aria-label="Computer Science student at Alryada University, GPA 3.68, class of 2027. Observability intern at EJADA. Fortinet Security Engineer track at DEPI and NTI. First place at the DevOpsDays Cairo 2026 hackathon. Speaks Arabic, English and Italian.">
  <style>
    text { white-space: pre; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
    .ln { opacity: 0; animation: in .4s ease-out forwards; }
    @keyframes in { from { opacity: 0 } to { opacity: 1 } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .k { fill: #F0597F; } .v { fill: #EDEDF2; } .c { fill: #5E5E6B; } .m { fill: #9A9AA8; }
  </style>
  <rect width="960" height="304" rx="16" fill="#0E0E13"/>
  <rect x="0.75" y="0.75" width="958.5" height="302.5" rx="15.25" stroke="#24242E" stroke-width="1.5"/>
  <path d="M0.75 16 A15.25 15.25 0 0 1 16 0.75 H944 A15.25 15.25 0 0 1 959.25 16 V40 H0.75 Z" fill="#15151C"/>
  <path d="M1 40 H959" stroke="#24242E"/>
  <circle cx="26" cy="20.5" r="5.5" fill="#2E2E3A"/>
  <circle cx="45" cy="20.5" r="5.5" fill="#2E2E3A"/>
  <circle cx="64" cy="20.5" r="5.5" fill="#2E2E3A"/>
  <text x="480" y="25" text-anchor="middle" class="mono" font-size="12" fill="#5E5E6B">~/about.yaml</text>

