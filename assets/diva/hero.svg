<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" fill="none" role="img" aria-label="Nourseen Tarek. Computer Science, observability, cloud and infrastructure security. DevOps to DevSecOps.">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 -20) scale(420 220)">
      <stop stop-color="#F0597F" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F0597F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="fade" x1="140" y1="0" x2="820" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2A35" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#2A2A35"/>
      <stop offset="0.85" stop-color="#2A2A35"/>
      <stop offset="1" stop-color="#2A2A35" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>
    .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .up { opacity: 0; animation: up .8s ease-out forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  </style>

  <rect width="960" height="290" rx="20" fill="#0E0E13"/>
  <rect width="960" height="290" rx="20" fill="url(#grid)"/>
  <rect width="960" height="290" rx="20" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="958.5" height="288.5" rx="19.25" stroke="#24242E" stroke-width="1.5"/>

  <text x="480" y="62" text-anchor="middle" class="mono up" font-size="12.5" letter-spacing="3" fill="#9A9AA8">DEVOPS <tspan fill="#F0597F">→</tspan> DEVSECOPS</text>
  <text x="480" y="132" text-anchor="middle" class="serif up" font-size="66" font-style="italic" fill="#F4F4F7" style="animation-delay:.15s">Nourseen Tarek</text>
  <text x="480" y="172" text-anchor="middle" class="sans up" font-size="16" letter-spacing="0.4" fill="#9A9AA8" style="animation-delay:.3s" xml:space="preserve">Computer Science  ·  Observability  ·  Cloud &amp; Infrastructure Security</text>

  <path d="M140 226 H820" stroke="url(#fade)" stroke-width="1.5"/>
  <g class="mono" font-size="11" fill="#5E5E6B" text-anchor="middle" letter-spacing="1">
    <circle cx="200" cy="226" r="4" fill="#0E0E13" stroke="#5E5E6B" stroke-width="1.5"/><text x="200" y="254">code</text>
    <circle cx="320" cy="226" r="4" fill="#0E0E13" stroke="#5E5E6B" stroke-width="1.5"/><text x="320" y="254">build</text>
    <circle cx="440" cy="226" r="4" fill="#0E0E13" stroke="#5E5E6B" stroke-width="1.5"/><text x="440" y="254">test</text>
    <circle cx="560" cy="226" r="4" fill="#0E0E13" stroke="#5E5E6B" stroke-width="1.5"/><text x="560" y="254">deploy</text>
    <circle cx="680" cy="226" r="4" fill="#0E0E13" stroke="#5E5E6B" stroke-width="1.5"/><text x="680" y="254">observe</text>
  </g>
  <g transform="translate(780 226)">
    <circle r="12" fill="#F0597F" fill-opacity="0.3" filter="url(#soft)">
      <animate attributeName="fill-opacity" values="0.1;0.45;0.1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 -10 L8.5 -6.2 V0 C8.5 5.4 4.6 8.5 0 10.8 C-4.6 8.5 -8.5 5.4 -8.5 0 V-6.2 Z" fill="#0E0E13" stroke="#F0597F" stroke-width="1.6"/>
    <path d="M-3.2 0.2 L-0.8 2.7 L3.6 -2.2" stroke="#F0597F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="28" class="mono" font-size="11" letter-spacing="1" fill="#F0597F" text-anchor="middle">secure</text>
  </g>
  <circle r="3.5" fill="#F0597F">
    <animateMotion dur="5s" repeatCount="indefinite" path="M200 226 H768"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
