<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" fill="none" role="img" aria-label="Nourseen Tarek. DevOps engineer in the making, DevSecOps loading.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14070F"/>
      <stop offset="0.55" stop-color="#2A0C1C"/>
      <stop offset="1" stop-color="#3B0F26"/>
    </linearGradient>
    <linearGradient id="name" x1="250" y1="0" x2="710" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB3C7"/>
      <stop offset="0.5" stop-color="#FF5C8A"/>
      <stop offset="1" stop-color="#F2C879"/>
      <animate attributeName="x1" values="250;-200;250" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="710;1160;710" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 40) scale(360 260)">
      <stop stop-color="#FF5C8A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF5C8A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 320) scale(380 240)">
      <stop stop-color="#F2C879" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2C879" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <path id="spark" d="M0 -7 C1 -1 1 -1 7 0 C1 1 1 1 0 7 C-1 1 -1 1 -7 0 C-1 -1 -1 -1 0 -7Z"/>
  </defs>
  <style>
    .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .tw { animation: tw 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6) } 50% { opacity: 1; transform: scale(1.1) } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .crown { animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-8deg) } 50% { transform: translateY(-4px) rotate(-4deg) } }
  </style>

  <rect width="960" height="340" rx="24" fill="url(#bg)"/>
  <rect width="960" height="340" rx="24" fill="url(#grid)"/>
  <rect width="960" height="340" rx="24" fill="url(#glowL)"/>
  <rect width="960" height="340" rx="24" fill="url(#glowR)"/>
  <rect x="1" y="1" width="958" height="338" rx="23" stroke="#FF5C8A" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- sparkles -->
  <g fill="#FFD6E0">
    <g transform="translate(86 92)"><use href="#spark" class="tw" style="animation-delay:0s"/></g>
    <g transform="translate(180 250) scale(.7)"><use href="#spark" class="tw" style="animation-delay:.8s"/></g>
    <g transform="translate(842 70) scale(1.1)"><use href="#spark" class="tw" style="animation-delay:1.3s"/></g>
    <g transform="translate(900 200) scale(.6)"><use href="#spark" class="tw" style="animation-delay:.4s"/></g>
    <g transform="translate(760 40) scale(.5)"><use href="#spark" class="tw" style="animation-delay:1.9s"/></g>
    <g transform="translate(52 200) scale(.5)"><use href="#spark" class="tw" style="animation-delay:2.2s"/></g>
  </g>
  <g fill="#F2C879">
    <g transform="translate(230 54) scale(.55)"><use href="#spark" class="tw" style="animation-delay:1.1s"/></g>
    <g transform="translate(700 278) scale(.6)"><use href="#spark" class="tw" style="animation-delay:.2s"/></g>
  </g>

  <!-- terminal prompt -->
  <g class="mono" font-size="14">
    <rect x="345" y="34" width="270" height="30" rx="15" fill="#FF5C8A" fill-opacity="0.12" stroke="#FF5C8A" stroke-opacity="0.45"/>
    <text x="480" y="54" text-anchor="middle" fill="#FFB3C7">~/nourseen <tspan fill="#F2C879">$</tspan> whoami<tspan class="blink" fill="#FF5C8A"> _</tspan></text>
  </g>

  <!-- crown over the N -->
  <g transform="translate(214 74)">
    <g class="crown">
      <path d="M0 22 L4 4 L13 14 L20 0 L27 14 L36 4 L40 22 Z" fill="#F2C879"/>
      <rect x="0" y="22" width="40" height="5" rx="2" fill="#D9A84E"/>
      <circle cx="20" cy="15" r="2.6" fill="#FF5C8A"/>
    </g>
  </g>

  <!-- name -->
  <text x="480" y="148" text-anchor="middle" class="serif" font-size="68" font-style="italic" fill="url(#name)">Nourseen Tarek</text>

  <!-- role line -->
  <text x="480" y="188" text-anchor="middle" class="sans" font-size="17" letter-spacing="3" fill="#FFD6E0" fill-opacity="0.9">DEVOPS ENGINEER IN THE MAKING  ·  CAIRO, EGYPT</text>

  <!-- loading bar -->
  <g class="mono" font-size="13">
    <text x="300" y="222" fill="#F2C879">devsecops.exe</text>
    <rect x="410" y="211" width="210" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.08" stroke="#FF5C8A" stroke-opacity="0.5"/>
    <rect x="412" y="213" width="0" height="10" rx="5" fill="#FF5C8A">
      <animate attributeName="width" values="0;150;150;0" keyTimes="0;0.7;0.92;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="632" y="222" fill="#FFB3C7">loading<tspan class="blink">...</tspan></text>
  </g>

  <!-- pipeline -->
  <g transform="translate(0 0)">
    <path id="pipe" d="M150 280 H810" stroke="#FF5C8A" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/>
    </path>
    <g class="mono" font-size="12" text-anchor="middle">
      <g>
        <circle cx="150" cy="280" r="9" fill="#2A0C1C" stroke="#FFB3C7" stroke-width="2"/>
        <text x="150" y="310" fill="#FFB3C7">code</text>
      </g>
      <g>
        <circle cx="282" cy="280" r="9" fill="#2A0C1C" stroke="#FFB3C7" stroke-width="2"/>
        <text x="282" y="310" fill="#FFB3C7">build</text>
      </g>
      <g>
        <circle cx="414" cy="280" r="9" fill="#2A0C1C" stroke="#FFB3C7" stroke-width="2"/>
        <text x="414" y="310" fill="#FFB3C7">test</text>
      </g>
      <g>
        <circle cx="546" cy="280" r="9" fill="#2A0C1C" stroke="#FFB3C7" stroke-width="2"/>
        <text x="546" y="310" fill="#FFB3C7">deploy</text>
      </g>
      <g>
        <circle cx="678" cy="280" r="9" fill="#2A0C1C" stroke="#FFB3C7" stroke-width="2"/>
        <text x="678" y="310" fill="#FFB3C7">monitor</text>
      </g>
      <!-- shield -->
      <g transform="translate(810 280)">
        <circle r="20" fill="#F2C879" fill-opacity="0.25" filter="url(#soft)">
          <animate attributeName="r" values="14;24;14" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <path d="M0 -13 L11 -8 V0 C11 7 6 11 0 14 C-6 11 -11 7 -11 0 V-8 Z" fill="#F2C879"/>
        <path d="M-4 0 L-1 3.5 L5 -3.5" stroke="#2A0C1C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="30" fill="#F2C879">secure</text>
      </g>
    </g>
    <!-- travelling commit -->
    <circle r="5" fill="#FF5C8A">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M150 280 H810"/>
    </circle>
    <circle r="11" fill="#FF5C8A" fill-opacity="0.35" filter="url(#soft)">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M150 280 H810"/>
    </circle>
  </g>
</svg>
