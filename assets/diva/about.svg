<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" fill="none" role="img" aria-label="About Nourseen: Computer Science student at Alryada University, GPA 3.68, class of 2027. Observability intern at EJADA. Fortinet Security Engineer track at DEPI and NTI. First place at the DevOpsDays Cairo 2026 hackathon. Speaks Arabic, English and Italian.">
