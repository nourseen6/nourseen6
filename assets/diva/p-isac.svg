<svg xmlns="http://www.w3.org/2000/svg" width="470" height="258" viewBox="0 0 470 258" fill="none" role="img" aria-label="ISAC Threat Monitor. Raspberry Pi sensor node (motion, distance, camera) streams over MQTT to a YOLOv8 person detector. Threat levels live on a Flask dashboard.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="470" y2="258" gradientUnits="userSpaceOnUse"><stop stop-color="#1C0A14"/><stop offset="1" stop-color="#2A0C1C"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="470" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#FF5C8A"/><stop offset="1" stop-color="#F2C879"/>
      <animate attributeName="x1" values="0;-470;0" dur="6s" repeatCount="indefinite"/><animate attributeName="x2" values="470;940;470" dur="6s" repeatCount="indefinite"/></linearGradient>
  </defs>
  <style>.mono{font-family:'Cascadia Code',Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}.sans{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}</style>
  <rect width="470" height="258" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="468" height="256" rx="17" stroke="url(#edge)" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="28" y="39" class="mono" font-size="11" letter-spacing="1.4" fill="#FF5C8A">AIoT · INTRUSION MONITORING</text>
  
  <text x="28" y="80" class="serif" font-size="27" font-style="italic" fill="#FFE9EF">ISAC Threat Monitor</text>
  <text x="28" y="148" class="sans" font-size="13.5" fill="#D9B3C1">Raspberry Pi sensor node (motion, distance, camera)</text>
  <text x="28" y="169" class="sans" font-size="13.5" fill="#D9B3C1">streams over MQTT to a YOLOv8 person detector.</text>
  <text x="28" y="190" class="sans" font-size="13.5" fill="#D9B3C1">Threat levels live on a Flask dashboard.</text>
  <rect x="28" y="212" width="111" height="24" rx="12" fill="#FF5C8A" fill-opacity="0.12" stroke="#FF5C8A" stroke-opacity="0.4"/><text x="83.5" y="228.5" text-anchor="middle" class="mono" font-size="12" fill="#FFB3C7">Raspberry Pi</text><rect x="147" y="212" width="66" height="24" rx="12" fill="#FF5C8A" fill-opacity="0.12" stroke="#FF5C8A" stroke-opacity="0.4"/><text x="180" y="228.5" text-anchor="middle" class="mono" font-size="12" fill="#FFB3C7">YOLOv8</text><rect x="221" y="212" width="52" height="24" rx="12" fill="#FF5C8A" fill-opacity="0.12" stroke="#FF5C8A" stroke-opacity="0.4"/><text x="247" y="228.5" text-anchor="middle" class="mono" font-size="12" fill="#FFB3C7">MQTT</text><rect x="281" y="212" width="59" height="24" rx="12" fill="#FF5C8A" fill-opacity="0.12" stroke="#FF5C8A" stroke-opacity="0.4"/><text x="310.5" y="228.5" text-anchor="middle" class="mono" font-size="12" fill="#FFB3C7">Flask</text>
  <rect x="28" y="98" width="138" height="24" rx="12" fill="#F2C879" fill-opacity="0.14" stroke="#F2C879" stroke-opacity="0.6"/><text x="97" y="114.5" text-anchor="middle" class="mono" font-size="11" fill="#F2C879">AIoT build · 2026</text>
</svg>
