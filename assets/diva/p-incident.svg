  <text x="28" y="39" class="mono" font-size="11" letter-spacing="1.4" fill="#5E5E6B">AI · SRE · POLICY AS CODE</text>
  
  <text x="28" y="80" class="sans" font-size="23" font-weight="600" fill="#EDEDF2">Incident Commander</text>
  <text x="28" y="148" class="sans" font-size="13.5" fill="#9A9AA8">Multi-agent incident diagnosis: weighs competing root</text>
  <text x="28" y="169" class="sans" font-size="13.5" fill="#9A9AA8">causes and picks the next check by information gain.</text>
  <text x="28" y="190" class="sans" font-size="13.5" fill="#9A9AA8">Only approved, reversible fixes run. Every call is signed.</text>
  <rect x="28" y="212" width="66" height="24" rx="12" fill="#0E0E13" stroke="#2E2E3A"/><text x="61" y="228.5" text-anchor="middle" class="mono" font-size="12" fill="#9A9AA8">Python</text><rect x="102" y="212" width="74" height="24" rx="12" fill="#0E0E13" stroke="#2E2E3A"/><text x="139" y="228.5" text-anchor="middle" class="mono" font-size="12" fill="#9A9AA8">FastAPI</text><rect x="184" y="212" width="59" height="24" rx="12" fill="#0E0E13" stroke="#2E2E3A"/><text x="213.5" y="228.5" text-anchor="middle" class="mono" font-size="12" fill="#9A9AA8">React</text><rect x="251" y="212" width="96" height="24" rx="12" fill="#0E0E13" stroke="#2E2E3A"/><text x="299" y="228.5" text-anchor="middle" class="mono" font-size="12" fill="#9A9AA8">TypeScript</text>
  <rect x="28" y="98" width="244" height="24" rx="12" fill="#F0597F" fill-opacity="0.08" stroke="#F0597F" stroke-opacity="0.55"/><text x="150" y="114.5" text-anchor="middle" class="mono" font-size="11" fill="#F0597F">1st place · DevOpsDays Cairo 2026</text>
