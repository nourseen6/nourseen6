<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" fill="none" role="img" aria-label="Roadmap. 01 network security, done. 02 observability, done. 03 DevOps, in progress. 04 DevSecOps, next.">
  <defs><filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter></defs>
  <style>
    .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  </style>
  <rect width="960" height="250" rx="16" fill="#0E0E13"/>
  <rect x="0.75" y="0.75" width="958.5" height="248.5" rx="15.25" stroke="#24242E" stroke-width="1.5"/>

  <path d="M140 44 H820" stroke="#24242E" stroke-width="1.5"/>
  <path d="M140 44 H595" stroke="#9A9AA8" stroke-width="1.5"/>
  <path d="M595 44 H820" stroke="#F0597F" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 5">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <circle cx="135" cy="44" r="5" fill="#9A9AA8"/>
  <circle cx="365" cy="44" r="5" fill="#9A9AA8"/>
  <circle cx="595" cy="44" r="11" fill="#F0597F" fill-opacity="0.35" filter="url(#soft)">
    <animate attributeName="fill-opacity" values="0.1;0.5;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="595" cy="44" r="6" fill="#F0597F"/>
  <circle cx="825" cy="44" r="5" fill="#0E0E13" stroke="#5E5E6B" stroke-width="1.5"/>

  <g class="sans">
    <rect x="30" y="72" width="210" height="150" rx="12" fill="#15151C" stroke="#24242E"/>
    <text x="50" y="100" class="mono" font-size="11" letter-spacing="1.5" fill="#5E5E6B">01 · DONE</text>
    <text x="50" y="128" font-size="17" font-weight="600" fill="#EDEDF2">Network security</text>
    <text x="50" y="156" font-size="13" fill="#9A9AA8">FortiGate · FortiManager</text>
    <text x="50" y="176" font-size="13" fill="#9A9AA8">IPsec VPN · IPS · VLANs</text>
    <text x="50" y="204" class="mono" font-size="11" fill="#5E5E6B">DEPI / NTI · 2024–25</text>

    <rect x="260" y="72" width="210" height="150" rx="12" fill="#15151C" stroke="#24242E"/>
    <text x="280" y="100" class="mono" font-size="11" letter-spacing="1.5" fill="#5E5E6B">02 · DONE</text>
    <text x="280" y="128" font-size="17" font-weight="600" fill="#EDEDF2">Observability</text>
    <text x="280" y="156" font-size="13" fill="#9A9AA8">AppDynamics · Dynatrace</text>
    <text x="280" y="176" font-size="13" fill="#9A9AA8">tracing · alerting · RCA</text>
    <text x="280" y="204" class="mono" font-size="11" fill="#5E5E6B">EJADA · 2026</text>

    <rect x="490" y="72" width="210" height="150" rx="12" fill="#1A1219" stroke="#F0597F" stroke-opacity="0.7"/>
    <text x="510" y="100" class="mono" font-size="11" letter-spacing="1.5" fill="#F0597F"><tspan class="pulse">●</tspan> 03 · NOW</text>
    <text x="510" y="128" font-size="17" font-weight="600" fill="#EDEDF2">DevOps</text>
    <text x="510" y="156" font-size="13" fill="#9A9AA8">Linux · Docker · CI/CD</text>
    <text x="510" y="176" font-size="13" fill="#9A9AA8">Kubernetes · Terraform</text>
    <rect x="510" y="198" width="170" height="4" rx="2" fill="#24242E"/>
    <rect x="510" y="198" width="0" height="4" rx="2" fill="#F0597F">
      <animate attributeName="width" values="0;105;105" keyTimes="0;0.45;1" dur="4s" repeatCount="indefinite"/>
    </rect>

    <rect x="720" y="72" width="210" height="150" rx="12" fill="#0E0E13" stroke="#2E2E3A" stroke-dasharray="5 5"/>
    <text x="740" y="100" class="mono" font-size="11" letter-spacing="1.5" fill="#5E5E6B">04 · NEXT</text>
    <text x="740" y="128" font-size="17" font-weight="600" fill="#EDEDF2">DevSecOps</text>
    <text x="740" y="156" font-size="13" fill="#9A9AA8">SAST · DAST · SCA in CI</text>
    <text x="740" y="176" font-size="13" fill="#9A9AA8">policy as code · secrets</text>
    <text x="740" y="204" class="mono" font-size="11" fill="#5E5E6B">supply-chain security</text>
  </g>
</svg>
