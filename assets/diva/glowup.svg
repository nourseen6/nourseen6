<svg xmlns="http://www.w3.org/2000/svg" width="960" height="318" viewBox="0 0 960 318" fill="none" role="img" aria-label="The glow-up pipeline. Stage 1, network security: done. Stage 2, observability: done. Stage 3, DevOps: in progress now. Stage 4, DevSecOps: up next.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16080F"/>
      <stop offset="1" stop-color="#2A0C1C"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF5C8A"/>
      <stop offset="1" stop-color="#F2C879"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>
    .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  </style>

  <rect width="960" height="318" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="316" rx="19" stroke="#FF5C8A" stroke-opacity="0.3" stroke-width="1.5"/>

  <text x="40" y="52" class="serif" font-size="26" font-style="italic" fill="#FFE9EF">The glow-up pipeline</text>
  <text x="920" y="52" text-anchor="end" class="mono" font-size="13" fill="#9C7083">git log --oneline --graph career</text>

  <!-- connector -->
  <path d="M135 98 H825" stroke="#FF5C8A" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M135 98 H595" stroke="url(#bar)" stroke-width="3"/>
  <path d="M595 98 H825" stroke="#F2C879" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="5 6">
    <animate attributeName="stroke-dashoffset" values="22;0" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <circle r="5" fill="#FFE9EF">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M135 98 H595"/>
  </circle>

  <!-- stage nodes -->
  <g>
    <circle cx="135" cy="98" r="13" fill="#FF5C8A"/>
    <path d="M129 98 L133.5 102.5 L141 94" stroke="#16080F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="365" cy="98" r="13" fill="#FF5C8A"/>
    <path d="M359 98 L363.5 102.5 L371 94" stroke="#16080F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="595" cy="98" r="22" fill="#F2C879" fill-opacity="0.35" filter="url(#soft)">
      <animate attributeName="r" values="14;26;14" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="595" cy="98" r="13" fill="#F2C879"/>
    <circle cx="595" cy="98" r="5" fill="#16080F"/>
    <circle cx="825" cy="98" r="13" fill="#16080F" stroke="#F2C879" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="819.5" y="96" width="11" height="8" rx="1.5" fill="#F2C879"/>
    <path d="M821.5 96 V93.5 a3.5 3.5 0 0 1 7 0 V96" stroke="#F2C879" stroke-width="1.8"/>
  </g>

  <!-- cards -->
  <g class="sans">
    <!-- 1 -->
    <rect x="30" y="130" width="210" height="160" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FF5C8A" stroke-opacity="0.35"/>
    <text x="48" y="158" class="mono" font-size="11" fill="#FF5C8A" letter-spacing="1.5">01 · DONE</text>
    <text x="48" y="186" font-size="18" font-weight="600" fill="#FFE9EF">Network security</text>
    <text x="48" y="214" font-size="13" fill="#D9B3C1">FortiGate &amp; FortiManager</text>
    <text x="48" y="234" font-size="13" fill="#D9B3C1">IPsec VPN · IPS · VLANs</text>
    <text x="48" y="254" font-size="13" fill="#D9B3C1">full CCNA curriculum</text>
    <text x="48" y="276" class="mono" font-size="11" fill="#9C7083">DEPI / NTI · 2024–25</text>

    <!-- 2 -->
    <rect x="260" y="130" width="210" height="160" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FF5C8A" stroke-opacity="0.35"/>
    <text x="278" y="158" class="mono" font-size="11" fill="#FF5C8A" letter-spacing="1.5">02 · DONE</text>
    <text x="278" y="186" font-size="18" font-weight="600" fill="#FFE9EF">Observability</text>
    <text x="278" y="214" font-size="13" fill="#D9B3C1">AppDynamics · Dynatrace</text>
    <text x="278" y="234" font-size="13" fill="#D9B3C1">log analytics · tracing</text>
    <text x="278" y="254" font-size="13" fill="#D9B3C1">alerting · incident RCA</text>
    <text x="278" y="276" class="mono" font-size="11" fill="#9C7083">EJADA · 2026</text>

    <!-- 3 -->
    <rect x="490" y="130" width="210" height="160" rx="14" fill="#F2C879" fill-opacity="0.08" stroke="#F2C879" stroke-width="1.5"/>
    <text x="508" y="158" class="mono" font-size="11" fill="#F2C879" letter-spacing="1.5">03 · <tspan class="pulse">● NOW</tspan></text>
    <text x="508" y="186" font-size="18" font-weight="600" fill="#FFE9EF">DevOps</text>
    <text x="508" y="214" font-size="13" fill="#E8D3B0">Linux · Docker · CI/CD</text>
    <text x="508" y="234" font-size="13" fill="#E8D3B0">Kubernetes · Terraform</text>
    <text x="508" y="254" font-size="13" fill="#E8D3B0">cloud: AWS / Azure / GCP</text>
    <rect x="508" y="268" width="174" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.1"/>
    <rect x="508" y="268" width="0" height="7" rx="3.5" fill="url(#bar)">
      <animate attributeName="width" values="0;112;112" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- 4 -->
    <rect x="720" y="130" width="210" height="160" rx="14" fill="#FFFFFF" fill-opacity="0.02" stroke="#F2C879" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="738" y="158" class="mono" font-size="11" fill="#F2C879" letter-spacing="1.5">04 · NEXT</text>
    <text x="738" y="186" font-size="18" font-weight="600" fill="#FFE9EF">DevSecOps</text>
    <text x="738" y="214" font-size="13" fill="#D9B3C1">SAST · DAST · SCA in CI</text>
    <text x="738" y="234" font-size="13" fill="#D9B3C1">policy as code (OPA)</text>
    <text x="738" y="254" font-size="13" fill="#D9B3C1">secrets · supply chain</text>
    <text x="738" y="276" class="mono" font-size="11" fill="#9C7083">unlocking soon</text>
  </g>
</svg>
